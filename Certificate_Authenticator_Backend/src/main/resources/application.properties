spring.application.name=CertificateAuthenticator

# Load variables from .env in the project root (optional so OS env vars also work)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

blockchain.node.url=${BLOCKCHAIN_NODE_URL}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS}
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
